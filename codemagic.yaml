workflows:
  ios-release:
    name: Planmoy iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Planmoy
    environment:
      ios_signing:
        certificates:
          - planmoy
        provisioning_profiles:
          - com.planmoy.app
      vars:
        BUNDLE_ID: "com.planmoy.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          cat > .env.local << 'ENVEOF'
          VITE_SUPABASE_URL=https://jveqmmmzwskgbvkcmgki.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2ZXFtbW16d3NrZ2J2a2NtZ2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTYzNDgsImV4cCI6MjEwNDUzMjM0OH0.VmODv6M2HQdebP-ylAznZQjaFg9mSpmAVSUERiYN_2Y
          VITE_PADDLE_CLIENT_TOKEN=live_3381ff0c0f887d38d87fc45458b
          VITE_PADDLE_ENVIRONMENT=production
          ENVEOF
          npm run build

      - name: Add iOS platform
        script: |
          npm install @capacitor/ios
          rm -rf ios
          npx cap add ios --packagemanager Cocoapods
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(date +%s)

      - name: Declare non-exempt encryption
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Add camera and photo library permissions
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Planmoy, StyleSync için kıyafet fotoğrafı çekmene izin ister.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Planmoy, StyleSync için kıyafet fotoğrafı çekmene izin ister.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Planmoy, StyleSync için galerinden fotoğraf seçmene izin ister.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Planmoy, StyleSync için galerinden fotoğraf seçmene izin ister.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Planmoy, seçtiğin fotoğrafı kaydetmek için izin ister.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Planmoy, seçtiğin fotoğrafı kaydetmek için izin ister.'" ios/App/App/Info.plist

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
