workflows:
  ios-release:
    name: Planmoy iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Planmoy
    environment:
      ios_signing:
        certificates:
          - planmoy
        provisioning_profiles:
          - com.planmoy.app
      vars:
        BUNDLE_ID: "com.planmoy.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform
        script: |
          npm install @capacitor/ios
          rm -rf ios
          npx cap add ios --packagemanager Cocoapods
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set build number from App Store Connect
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number "6814797446" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD + 1))

      - name: Declare non-exempt encryption
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Build ipa
        script: |
          set -x
          mkdir -p build/ios/xcarchive
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=ACF8775WKR \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive | tee /tmp/xcodebuild_archive.log | xcbeautify || true
          test -d build/ios/xcarchive/App.xcarchive

      - name: Export ipa
        script: |
          set -x
          mkdir -p build/ios/ipa
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>ACF8775WKR</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.planmoy.app</key>
              <string>com.planmoy.app</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | tee /tmp/xcodebuild_export.log | xcbeautify || true
          echo "----- EXPORT HATA GÜNLÜĞÜ (son 60 satır) -----"
          tail -n 60 /tmp/xcodebuild_export.log
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
