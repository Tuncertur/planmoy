<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planmoy</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070b20; color: #edf2ff; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { letter-spacing: -.04em; }
      p { color: #aeb9d9; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Planmoy</h1>
      <p>This native shell is ready. Configure <code>PLANMOY_MOBILE_URL</code> before syncing to connect it to the hosted Planmoy web app.</p>
    </main>
  </body>
</html>
